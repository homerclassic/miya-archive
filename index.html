  <!-- dev-importmap:start — resolves the bare 'html2canvas' import for `npm run dev`; stripped from dist by build.mjs -->
  <script type="importmap">
    {"imports": {"html2canvas": "./node_modules/html2canvas/dist/html2canvas.esm.js"}}
  </script>
  <!-- dev-importmap:end -->
  <link rel="modulepreload" href="js/main.js">

  <!-- Applies saved preferences before first paint so there is no flash (reader mode, quick search). -->
  <script>
    document.documentElement.dataset.t = 'light';
    try {
      if (localStorage.r == '1') document.documentElement.dataset.r = '1';
      if (localStorage.k != '1') document.documentElement.dataset.k = '0';
    } catch (e) {}
  </script>
